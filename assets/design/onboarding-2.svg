"180" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="400" fill="#98A2B3" text-anchor="start" letter-spacing="0.0" xml:space="preserve">‹ Back</text><text x="1032" y="180" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="400" fill="#98A2B3" text-anchor="end" letter-spacing="0.0" xml:space="preserve">Skip</text><rect x="48" y="2208" width="984" height="144" rx="48" fill="url(#cta)"/><text x="540" y="2301" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="0.0" xml:space="preserve">Next</text><rect x="465" y="2142" width="18" height="18" rx="9" fill="#272B36"/><rect x="495" y="2142" width="60" height="18" rx="9" fill="#9945FF"/><rect x="567" y="2142" width="18" height="18" rx="9" fill="#272B36"/><rect x="597" y="2142" width="18" height="18" rx="9" fill="#272B36"/><text x="48" y="1776" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="400" fill="#98A2B3" text-anchor="start" letter-spacing="0.0" xml:space="preserve">SolContacts holds public addresses and</text><text x="48" y="1848" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="400" fill="#98A2B3" text-anchor="start" letter-spacing="0.0" xml:space="preserve">nothing else. There is no signing path in</text><text x="48" y="1920" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="400" fill="#98A2B3" text-anchor="start" letter-spacing="0.0" xml:space="preserve">the app at all — so there is nothing to</text><text x="48" y="1992" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="400" fill="#98A2B3" text-anchor="start" letter-spacing="0.0" xml:space="preserve">approve, and nothing to lose.</text><text x="48" y="1602" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="84" font-weight="700" fill="#F7F9FC" text-anchor="start" letter-spacing="-1.8" xml:space="preserve">Not a wallet. Ever.</text><g transform="translate(0,438)"><rect x="48" y="0" width="984" height="450" rx="60" fill="url(#card)"/><rect x="48" y="0" width="984" height="450" rx="60" fill="none" stroke="#272B36" stroke-width="3"/><text x="108" y="96" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="39" font-weight="500" fill="#98A2B3" text-anchor="start" letter-spacing="1.5" xml:space="preserve">WHAT IT DOES</text><g transform="translate(108,162) scale(2.5000)"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#14F195" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="204" y="207" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="400" fill="#F7F9FC" text-anchor="start" letter-spacing="0.0" xml:space="preserve">Stores public addresses, on this device</text><g transform="translate(108,252) scale(2.5000)"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#14F195" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="204" y="297" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="400" fill="#F7F9FC" text-anchor="start" letter-spacing="0.0" xml:space="preserve">Reads balances from the network</text><g transform="translate(108,342) scale(2.5000)"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#14F195" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="204" y="387" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="400" fill="#F7F9FC" text-anchor="start" letter-spacing="0.0" xml:space="preserve">Works with no account and no server</text><rect x="48" y="486" width="984" height="450" rx="60" fill="url(#card)"/><rect x="48" y="486" width="984" height="450" rx="60" fill="none" stroke="#272B36" stroke-width="3"/><text x="108" y="582" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="39" font-weight="500" fill="#98A2B3" text-anchor="start" letter-spacing="1.5" xml:space="preserve">WHAT IT NEVER DOES</text><g transform="translate(108,648) scale(2.5000)"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#FF6B6B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="204" y="693" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="400" fill="#F7F9FC" text-anchor="start" letter-spacing="0.0" xml:space="preserve">Ask for a seed phrase</text><g transform="translate(108,738) scale(2.5000)"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#FF6B6B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="204" y="783" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="400" fill="#F7F9FC" text-anchor="start" letter-spacing="0.0" xml:space="preserve">Hold or store a private key</text><g transform="translate(108,828) scale(2.5000)"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#FF6B6B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="204" y="873" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="400" fill="#F7F9FC" text-anchor="start" letter-spacing="0.0" xml:space="preserve">Sign, send or move funds</text></g></svg>